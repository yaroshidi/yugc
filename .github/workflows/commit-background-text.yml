name: Commit background text

on:
  push:
    branches: [main]
    paths:
      - .github/background-slice.b64

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/apply-background.py
      - name: Commit the fixed bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/main-DLg1oGUN.js
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Wrap the background type the way Elva does."
          git push
