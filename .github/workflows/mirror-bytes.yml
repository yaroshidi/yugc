name: Copy the local media bytes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-bytes
  cancel-in-progress: false

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace videos and stills with the local bytes
        run: |
          set -euo pipefail
          copy() {
            local sha="$1" path="$2" url="$3"
            if [[ -f "$path" ]] && echo "$sha  $path" | sha256sum -c --status; then
              echo "have $path"
              return
            fi
            curl -fsSL -A "Mozilla/5.0" -o "$path" "$url"
            echo "$sha  $path" | sha256sum -c -
          }
          copy 3d3427921d5cc6033c9ea9d67ef0abef29202395fcbeb519bd5de14ff3933de5 public/casesprite.webm https://n.uguu.se/zBplYJYF.webm
          copy 6e9f85100e9a94eea5459aa9237fd0993fb3343fb2d8f23ef72ed17317df5022 public/features/0.png https://n.uguu.se/CyuzdPdr.png
          copy cadfe83478a2965ad4b2594bcecadb4f508797a7024b88fadd7836a7f10aa7de public/features/1.png https://h.uguu.se/USZHguDk.png
          copy 50868f760af63c34f325cf5bee54deba9633587e3eece400c61bcb7e07a03a5e public/features/2.png https://d.uguu.se/awQfmkNf.png
          copy 0fed7015c73b90560473f621076d8a4a00dd8d06acd2506926f9efb5f4317cab public/features/3.png https://h.uguu.se/ClASwDjD.png
          copy 7eb9ac0313d1bd46539545b87e11ab51f2e036dff0a29640b70434c46b6ca1d9 public/features/4.png https://d.uguu.se/nQlVEeLk.png
          copy 78941575dbd005221b6c70f31c167a1da141d1b824b72f9c063b98eb15fa4078 public/flow0_fixed.webm https://d.uguu.se/XVmDsQYf.webm
          copy ce108ebb262bb83ce671a7c5ad37ff8cf3c4c83da8bfdf1d3fd66521d1fefbf2 public/flow_fixed_m.webm https://n.uguu.se/XEvdtxZw.webm
          copy ca67f44d5bb522700b3b8ea5a80d0bd6c4728634fc0435566c6cfec5994885b5 public/girl.webm https://n.uguu.se/PRtGvBnv.webm
          copy 40a66dddeb55b587e7b9639fdaf615fae64e1655e665510badf252f3f8dc2480 public/mainflow/1_1_m.webm https://n.uguu.se/rgMMwGLx.webm
          copy f04ce7caba6ad1755eaebeecc7b23c0f004bfbf5738f65337c0428f576b322b9 public/mainflow/1_2_m.webm https://d.uguu.se/THMHqHtx.webm
          copy 6c39e422e3f96783bb7522be0ac051bedd7ffa13a9a8aea7ecced090715c50d4 public/mainflow/1_3_m.webm https://d.uguu.se/CeCERdJv.webm
          copy 1d2bc3568484db2a6a08b430afc51ca9e7ad1572aa00a87618b842e05a3c61b0 public/mainflow/1_41_m.webm https://n.uguu.se/WyvRwYdb.webm
          copy de465f3700ceff1fd6cf246354d124af50336c7a727c4f821d9ea58f34b52c66 public/mainflow/1_5_m.webm https://d.uguu.se/RmBBwhrv.webm
          copy 79fdd4571c8ddee8044f4bd8e8f8e07d27b8e4bda68b89e3e811ddd5f09bdf3d public/sprite_s.webm https://n.uguu.se/KaCZbVEl.webm
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/casesprite.webm \
            public/features/0.png \
            public/features/1.png \
            public/features/2.png \
            public/features/3.png \
            public/features/4.png \
            public/flow0_fixed.webm \
            public/flow_fixed_m.webm \
            public/girl.webm \
            public/mainflow/1_1_m.webm \
            public/mainflow/1_2_m.webm \
            public/mainflow/1_3_m.webm \
            public/mainflow/1_41_m.webm \
            public/mainflow/1_5_m.webm \
            public/sprite_s.webm
          if git diff --cached --quiet; then
            echo "media already matches"
          else
            git commit -m "Copy the local video and still bytes."
            git pull --rebase origin main
            git push origin HEAD:main
          fi
