name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore the previous site files
        run: |
          set -euo pipefail
          if grep -q 'hero-fallback' public/index.html; then
            echo "Site files already include the Pages hero."
            exit 0
          fi
          base=https://raw.githubusercontent.com/yaroshidi/yugc/c4a8828afd539c5ae5c95cc9e8a92dd8fd869d2d
          files=(
            public/assets/GravityBalls-D37pvzOo.js
            public/assets/NeueHaasDisplay-XXThin-B_GJ8Mxd.js
            public/assets/main-DLg1oGUN.js
            public/assets/menu-DjKzWaJ3.css
            public/careers.html
            public/index.html
            public/mainflow/1_41_m.mp4
            public/press-center.html
            public/privacy-policy.html
            public/site.webmanifest
            public/terms-of-use.html
          )
          for path in "${files[@]}"; do
            curl -fsSL "$base/$path" -o "$path"
          done
          python3 - << 'PY'
          from pathlib import Path
          page = Path("public/index.html")
          text = page.read_text()
          old = 'if (video.readyState >= 2) video.classList.add("is-ready");'
          new = 'if (video.readyState >= 2 && !video.classList.contains("is-ready")) video.classList.add("is-ready");'
          if old not in text:
              raise SystemExit("freeze guard pattern was not found")
          page.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if [[ -f scripts/prepare-github-pages.mjs ]]; then
            git rm -f scripts/prepare-github-pages.mjs
          fi
          git commit -m "Restore the GitHub Pages site and stop the video observer loop."
          git push origin HEAD:main

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
