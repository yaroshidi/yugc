name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Match the current site and encode WebM
        run: |
          set -euo pipefail
          node scripts/apply-site-patches.mjs
          node scripts/apply-cleanup.mjs

          encode() {
            local in="$1" out="$2"
            shift 2
            if [[ -f "$out" ]]; then
              echo "have $out"
              return
            fi
            if [[ ! -f "$in" ]]; then
              echo "missing $in" >&2
              exit 1
            fi
            ffmpeg -y -i "$in" -an "$@" "$out"
          }

          common=(-c:v libvpx-vp9 -row-mt 1 -cpu-used 6 -deadline good -threads 2 -tile-columns 1 -pix_fmt yuv420p -lag-in-frames 16)
          encode public/girl.mp4 public/girl.webm "${common[@]}" -b:v 0 -crf 32
          encode public/sprite_s.mp4 public/sprite_s.webm "${common[@]}" -b:v 0 -crf 32
          encode public/casesprite.mp4 public/casesprite.webm "${common[@]}" -b:v 0 -crf 32
          encode public/flow0_fixed.mp4 public/flow0_fixed.webm "${common[@]}" -b:v 0 -crf 33
          encode public/flow_fixed_m.mp4 public/flow_fixed_m.webm "${common[@]}" -b:v 0 -crf 33
          encode public/mainflow/1_1_m.mp4 public/mainflow/1_1_m.webm "${common[@]}" -b:v 0 -crf 36
          encode public/mainflow/1_2_m.mp4 public/mainflow/1_2_m.webm "${common[@]}" -b:v 0 -crf 36
          encode public/mainflow/1_5_m.mp4 public/mainflow/1_5_m.webm "${common[@]}" -b:v 0 -crf 36
          encode public/mainflow/1_3_m.mp4 public/mainflow/1_3_m.webm -vf fps=30 "${common[@]}" -b:v 1200k -crf 38
          encode public/mainflow/1_41_m.mp4 public/mainflow/1_41_m.webm "${common[@]}" -b:v 1400k -crf 40

          # The feature list used to show someone else's camera clips.
          # Swap those stills for frames from the creator sheet when the old files are still in place.
          old0=0f23411837bdc3a4e37f3c9648eeb89512a2ed267791bad2b123d33d5c2fbff8
          if [[ -f public/features/0.png ]] && [[ "$(sha256sum public/features/0.png | awk '{print $1}')" == "$old0" ]]; then
            ffmpeg -y -ss 2 -i public/casesprite.webm -frames:v 1 /tmp/case.png
            crop() {
              local col="$1" row="$2" out="$3"
              ffmpeg -y -i /tmp/case.png -vf "crop=430:932:$((col * 430)):$((row * 932))" "$out"
            }
            crop 0 0 public/features/0.png
            crop 3 0 public/features/1.png
            crop 1 1 public/features/2.png
            crop 1 0 public/features/3.png
            crop 2 0 public/features/4.png
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          mp4s=(public/*.mp4 public/mainflow/*.mp4)
          if ((${#mp4s[@]})); then
            git rm -f "${mp4s[@]}"
          fi
          git add -A public
          if git diff --cached --quiet; then
            echo "site files already current"
          else
            git commit -m "Publish the WebM site without the fallback phone."
            git push origin HEAD:main
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
