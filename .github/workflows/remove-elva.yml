name: Remove Elva names

on:
  push:
    branches: [main]
    paths:
      - .github/remove-elva.py

permissions:
  contents: write
  actions: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/remove-elva.py
      - name: Publish the rewritten pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/careers.html public/privacy-policy.html public/terms-of-use.html
          git rm -f .github/remove-elva.py .github/workflows/remove-elva.yml
          git commit -m "Remove every Elva name from the site."
          git push
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/yaroshidi/yugc/actions/workflows/pages.yml/dispatches \
            -d '{"ref":"main"}'
